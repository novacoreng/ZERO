<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">ZERO logo lockup</title>
  <desc id="desc">ZERO disappearing privacy symbol with the ZERO wordmark and private messaging tagline.</desc>
  <defs>
    <radialGradient id="orb" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#D9FFFA"/>
      <stop offset="42%" stop-color="#76E2D8"/>
      <stop offset="100%" stop-color="#168F91"/>
    </radialGradient>
    <linearGradient id="arcA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CF3EA"/>
      <stop offset="52%" stop-color="#2BB9B7"/>
      <stop offset="100%" stop-color="#0F777D"/>
    </linearGradient>
    <linearGradient id="arcB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4FFFB"/>
      <stop offset="55%" stop-color="#5AD6D0"/>
      <stop offset="100%" stop-color="#1C969A"/>
    </linearGradient>
  </defs>

  <g transform="translate(194 30) scale(.55)">
    <circle cx="256" cy="256" r="103" fill="url(#orb)"/>
    <g fill="none" stroke-linecap="round" stroke-width="46">
      <path d="M111 151 A178 178 0 0 1 216 78" stroke="url(#arcA)"/>
      <path d="M296 78 A178 178 0 0 1 401 151" stroke="url(#arcB)"/>
      <path d="M401 361 A178 178 0 0 1 296 434" stroke="url(#arcA)"/>
      <path d="M216 434 A178 178 0 0 1 111 361" stroke="url(#arcB)"/>
    </g>
  </g>

  <text x="450" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="600" letter-spacing="30" fill="#123F45">ZERO</text>
  <text x="450" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" letter-spacing="9" fill="#278A8E">PRIVATE MESSAGING / THAT DISAPPEARS</text>
</svg>
