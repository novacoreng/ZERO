<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ZERO disappearing privacy mark</title>
  <desc id="desc">A glass lagoon orb surrounded by four separated rounded arcs, representing private messages disappearing.</desc>
  <defs>
    <radialGradient id="orb" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#D9FFFA"/>
      <stop offset="42%" stop-color="#76E2D8"/>
      <stop offset="100%" stop-color="#168F91"/>
    </radialGradient>
    <linearGradient id="arcA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CF3EA"/>
      <stop offset="52%" stop-color="#2BB9B7"/>
      <stop offset="100%" stop-color="#0F777D"/>
    </linearGradient>
    <linearGradient id="arcB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4FFFB"/>
      <stop offset="55%" stop-color="#5AD6D0"/>
      <stop offset="100%" stop-color="#1C969A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="103" fill="url(#orb)" filter="url(#soft)"/>

  <g fill="none" stroke-linecap="round" stroke-width="46">
    <path d="M111 151 A178 178 0 0 1 216 78" stroke="url(#arcA)"/>
    <path d="M296 78 A178 178 0 0 1 401 151" stroke="url(#arcB)"/>
    <path d="M401 361 A178 178 0 0 1 296 434" stroke="url(#arcA)"/>
    <path d="M216 434 A178 178 0 0 1 111 361" stroke="url(#arcB)"/>
  </g>

  <g fill="none" stroke="#E9FFFD" stroke-linecap="round" stroke-width="3" opacity=".75">
    <path d="M111 151 A178 178 0 0 1 216 78"/>
    <path d="M296 78 A178 178 0 0 1 401 151"/>
    <path d="M401 361 A178 178 0 0 1 296 434"/>
    <path d="M216 434 A178 178 0 0 1 111 361"/>
  </g>
</svg>
