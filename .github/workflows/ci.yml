name: ZERO CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck security core
        run: pnpm typecheck
      - name: Run security-core tests
        run: pnpm test
      - name: Typecheck web
        run: pnpm --dir apps/web typecheck
      - name: Build Next.js web
        run: pnpm --dir apps/web build
      - name: Typecheck Expo mobile
        run: pnpm --dir apps/mobile typecheck
      - name: Bundle Expo Android test artifact
        run: pnpm --dir apps/mobile bundle:test
      - name: Repository security scan
        run: pnpm security:check
